name: Release

# Stages a release on npm when a `v*` tag is pushed. The tag must match the
# `version` in package.json (checked below). Authentication uses npm trusted
# publishing (OIDC) — this publisher is stage-only, so a maintainer must
# approve the staged package with 2FA before it goes live.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# `id-token: write` is required for npm trusted publishing (OIDC) and lets
# npm attach a signed provenance statement.
permissions:
  contents: read
  id-token: write

# Never let two releases race for the same version.
concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never use a package-manager cache in a release build.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # `prepublishOnly: npm test` also runs on stage; this step makes the
      # failure visible before the upload and keeps the workflow readable.
      - name: Test
        run: npm test

      # Trusted publishing (OIDC) authenticates the upload; no npm token is
      # needed. The trusted publisher is stage-only, so this stages the package
      # for a maintainer to review and approve with 2FA. Provenance is
      # generated automatically for public repos.
      - name: Stage release
        run: npm stage publish --access public
